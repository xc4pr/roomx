name: Catalog update

# Weekly catalog update: Monday 04:17 Swiss time.
# GitHub cron only knows UTC: 04:17 is 02:17 UTC in summer (CEST) and 03:17 UTC
# in winter (CET). Both lines fire every Monday; the gate job lets only the one
# through whose cron line matches today's Zurich offset. It compares the cron
# line (github.event.schedule), not the clock, because GitHub may start
# scheduled runs late and a late run must not be skipped.
#
# The update job reads the shop pages and runs third-party packages and the
# tests, so it only gets read access. It hands its data to the publish job as an
# artifact; that job runs no installed packages, checks the data, opens issues
# and commits.
on:
  schedule:
    - cron: "17 2 * * 1"
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      shops:
        description: "Shops, comma separated"
        default: "ikea,jysk,tchibo"
        type: string
      budget_min:
        description: "Time budget per shop in minutes"
        default: "270"
        type: string
      max_urls:
        description: "Maximum URLs per shop (empty = all)"
        default: ""
        type: string
      dry_run:
        description: "Run everything but do not commit or push (issues are still opened)"
        default: false
        type: boolean

permissions: {}

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=Europe/Zurich date +%z)
          case "$offset" in
            +0200) want="17 2 * * 1" ;;
            +0100) want="17 3 * * 1" ;;
            *) echo "::error::Unexpected Zurich offset $offset"; exit 1 ;;
          esac
          if [ "$SCHEDULE" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cron line '$SCHEDULE' is not 04:17 Zurich today (offset $offset), skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
    env:
      SHOPS_IN: ${{ inputs.shops || 'ikea,jysk,tchibo' }}
      SKIP_SHOPS: ${{ vars.CATALOG_SKIP_SHOPS }}
      BUDGET_MIN: ${{ inputs.budget_min || '270' }}
      MAX_URLS: ${{ inputs.max_urls }}
      ROOMX_MIRROR_RELAYS: ws://127.0.0.1:4275
      ROOMX_MIRROR_STUN: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare
        run: |
          echo "TODAY=$(TZ=Europe/Zurich date +%F)" >> "$GITHUB_ENV"
          mkdir -p catalog-index/out
          if [ -f catalog-index/requirements.txt ]; then
            python3 -m pip install -r catalog-index/requirements.txt
          fi
          python -m venv server/.venv
          server/.venv/bin/pip install -e 'server[dev]'
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium

      - name: Python unit tests
        run: python3 -m unittest discover -s catalog-index/test

      - name: Index runs (shops in parallel)
        run: |
          set -u
          # Selected shops minus those switched off by repository variable CATALOG_SKIP_SHOPS.
          shops=()
          IFS=, read -ra want <<< "${SHOPS_IN// /}"
          IFS=, read -ra skip <<< "${SKIP_SHOPS// /}"
          for s in "${want[@]}"; do
            case "$s" in ikea|jysk|tchibo) ;; *) echo "::error::Unknown shop: $s"; exit 1 ;; esac
            drop=0
            for k in "${skip[@]:-}"; do [ "$k" = "$s" ] && drop=1; done
            if [ "$drop" = 1 ]; then echo "Shop $s skipped (CATALOG_SKIP_SHOPS)"; else shops+=("$s"); fi
          done
          [[ "$BUDGET_MIN" =~ ^[0-9]+$ ]] || { echo "::error::budget_min must be a number"; exit 1; }
          extra=()
          if [ -n "$MAX_URLS" ]; then
            [[ "$MAX_URLS" =~ ^[0-9]+$ ]] || { echo "::error::max_urls must be a number"; exit 1; }
            extra=(--max-urls "$MAX_URLS")
          fi

          declare -A pids
          for s in "${shops[@]}"; do
            python3 catalog-index/update.py index --shop "$s" \
              --budget-min "$BUDGET_MIN" "${extra[@]}" \
              > "catalog-index/out/$s.log" 2>&1 &
            pids[$s]=$!
          done

          blocked=""; failed=""
          for s in "${shops[@]}"; do
            rc=0
            wait "${pids[$s]}" || rc=$?
            echo "::group::$s (exit $rc)"; tail -n 40 "catalog-index/out/$s.log"; echo "::endgroup::"
            case "$rc" in
              0) ;;
              2) blocked="$blocked $s" ;;
              *) failed="$failed $s" ;;
            esac
          done
          # The publish job opens one issue per blocked shop; the other shops still get published.
          echo "BLOCKED=${blocked# }" >> "$GITHUB_ENV"

          if [ -n "$failed" ]; then
            echo "::error::Index run failed for:$failed"
            exit 1
          fi

      - name: Normalize
        run: |
          rc=0
          python3 catalog-index/update.py normalize || rc=$?
          case "$rc" in
            0) ;;
            3) echo "GUARD=1" >> "$GITHUB_ENV" ;;
            *) exit "$rc" ;;
          esac

      - name: Set price date
        if: env.GUARD != '1'
        run: python3 catalog-index/update.py stand --datum "$TODAY"

      - name: Lint, check, test
        if: env.GUARD != '1'
        run: |
          pnpm -C web lint
          pnpm -C web check
          pnpm -C web test

      - name: E2E Chromium
        if: env.GUARD != '1'
        run: |
          pnpm -C web test:e2e
          echo "TESTED=1" >> "$GITHUB_ENV"

      - name: Hand over the result
        if: always()
        run: |
          r="$RUNNER_TEMP/result"
          mkdir -p "$r"
          {
            echo "today=${TODAY:-}"
            echo "blocked=${BLOCKED:-}"
            echo "guard=${GUARD:-0}"
            echo "tested=${TESTED:-0}"
          } > "$r/flags.txt"
          for f in report.md curated.md; do
            if [ -f "catalog-index/out/$f" ]; then cp "catalog-index/out/$f" "$r/"; fi
          done
          if [ "${TESTED:-0}" = 1 ]; then
            mkdir -p "$r/data"
            cp web/src/lib/catalog/data/full.json "$r/data/"
            cp -r catalog-index/state "$r/data/state"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-update-result
          path: ${{ runner.temp }}/result/
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Catalog update $TODAY"
            echo
            echo "Protection rule: ${GUARD:-0}, tested: ${TESTED:-0}, blocked: ${BLOCKED:-none}"
            echo
            if [ -f catalog-index/out/report.md ]; then cat catalog-index/out/report.md; else echo "No report.md present."; fi
            for f in catalog-index/out/*-index.json; do
              [ -f "$f" ] || continue
              echo
              echo "### $(basename "$f")"
              jq -r 'to_entries | map(select(.value | type != "array" and type != "object")) | map("- \(.key): \(.value)") | .[]' "$f" || true
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-index-out
          path: catalog-index/out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [gate, update]
    if: always() && needs.gate.outputs.run == 'true' && (needs.update.result == 'success' || needs.update.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Download result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-update-result
          path: ${{ runner.temp }}/result

      - name: Read result
        run: |
          echo "RESULT=$RUNNER_TEMP/result" >> "$GITHUB_ENV"
          # The file comes from the update job: read single values, never source it.
          f="$RUNNER_TEMP/result/flags.txt"
          val() { sed -n "s/^$1=//p" "$f" | head -n 1; }
          today=$(val today); blocked=$(val blocked); guard=$(val guard); tested=$(val tested)
          [[ "$today" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Bad date in result"; exit 1; }
          [[ "$blocked" =~ ^((ikea|jysk|tchibo)( (ikea|jysk|tchibo))*)?$ ]] || { echo "::error::Bad shop list in result"; exit 1; }
          [[ "$guard" =~ ^[01]$ && "$tested" =~ ^[01]$ ]] || { echo "::error::Bad flags in result"; exit 1; }
          {
            echo "TODAY=$today"
            echo "BLOCKED=$blocked"
            echo "GUARD=$guard"
            echo "TESTED=$tested"
          } >> "$GITHUB_ENV"
          gh label create catalog-update --color 0e8a16 \
            --description "Weekly catalog update" 2>/dev/null || true

      - name: Blocked shops, open issue
        if: env.BLOCKED != ''
        run: |
          for s in $BLOCKED; do
            title="Catalog update: $s blocks requests from GitHub"
            body="$s blocks requests from GitHub; fallback via server, see the instructions. (Run $TODAY: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            n=$(gh issue list --label catalog-update --state open --json number,title \
                --jq "map(select(.title == \"$title\"))[0].number // empty")
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
            else gh issue create --label catalog-update --title "$title" --body "$body"; fi
          done

      - name: Protection rule triggered, open issue
        if: env.GUARD == '1'
        run: |
          report="$RESULT/report.md"
          [ -f "$report" ] || { echo "Protection rule triggered, no report present." > "$RUNNER_TEMP/report.md"; report="$RUNNER_TEMP/report.md"; }
          title="Catalog update $TODAY: protection rule triggered"
          n=$(gh issue list --label catalog-update --state open --json number,title \
              --jq 'map(select(.title | endswith("protection rule triggered")))[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$report"
          else
            gh issue create --label catalog-update --title "$title" --body-file "$report"
          fi

      - name: Curated entries differ, open issue
        if: env.GUARD != '1'
        run: |
          [ -s "$RESULT/curated.md" ] || { echo "No differences in curated entries."; exit 0; }
          n=$(gh issue list --label catalog-update --state open --json number,title \
              --jq 'map(select(.title | endswith("curated entries differ")))[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RESULT/curated.md"
          else
            gh issue create --label catalog-update --title "Catalog update $TODAY: curated entries differ" \
              --body-file "$RESULT/curated.md"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.TESTED == '1'
        with:
          ref: main
          fetch-depth: 0

      - name: Take over the data
        if: env.TESTED == '1'
        run: |
          src="$RESULT/data"
          # Only regular files and folders from the update job, and a catalogue that only links to the three shops.
          [ -f "$src/full.json" ] && [ ! -L "$src/full.json" ] || { echo "::error::full.json missing"; exit 1; }
          [ -d "$src/state" ] && [ ! -L "$src/state" ] || { echo "::error::state missing"; exit 1; }
          [ -z "$(find "$src" ! -type f ! -type d)" ] || { echo "::error::Unexpected file type in result"; exit 1; }
          python3 -I - "$src/full.json" <<'PY'
          import json, sys
          from urllib.parse import urlsplit
          hosts = {'www.ikea.com', 'jysk.ch', 'www.tchibo.ch'}
          entries = json.load(open(sys.argv[1], encoding='utf-8'))
          if not isinstance(entries, list) or not entries:
              sys.exit('full.json: list of entries expected')
          for e in entries:
              if not isinstance(e, dict) or not isinstance(e.get('id'), str):
                  sys.exit(f'full.json: bad entry {str(e)[:80]}')
              url = e.get('url')
              if url is not None:
                  p = urlsplit(url) if isinstance(url, str) else None
                  if not p or p.scheme != 'https' or p.hostname not in hosts:
                      sys.exit(f'full.json: link outside the shops in {e["id"]}')
          print(f'{len(entries)} entries checked')
          PY
          cp "$src/full.json" web/src/lib/catalog/data/full.json
          rm -rf catalog-index/state
          cp -r "$src/state" catalog-index/state
          python3 catalog-index/update.py stand --datum "$TODAY"
          other=$(git status --porcelain | grep -v -e ' web/src/lib/catalog/data/full.json$' \
                    -e ' web/src/lib/catalog/index.ts$' -e ' catalog-index/state/' || true)
          [ -z "$other" ] || { echo "::error::Unexpected changes: $other"; exit 1; }
          if [ -n "$(git status --porcelain -- web/src/lib/catalog/data/full.json catalog-index/state)" ]; then
            echo "CHANGED=1" >> "$GITHUB_ENV"
          else
            echo "No changes in full.json or state."
          fi

      - name: Commit and push to main
        if: env.CHANGED == '1' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- web/src/lib/catalog/data/full.json web/src/lib/catalog/index.ts catalog-index/state
          git commit -m "catalog: weekly update $TODAY"
          # No tag on purpose: pages.yml shows the version from git describe --tags.
          git push origin HEAD:main
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Start Pages build
        # A push with GITHUB_TOKEN does not trigger other workflows.
        if: env.PUSHED == '1'
        run: gh workflow run pages.yml --ref main

      - name: Bring dev up to date
        if: env.PUSHED == '1'
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          if git merge --no-edit origin/main; then
            git push origin dev
          else
            git merge --abort
            title="Catalog update $TODAY: merge main into dev by hand"
            body="Automatic merge of main into dev failed (conflict). Please merge main into dev by hand."
            n=$(gh issue list --label catalog-update --state open --json number,title \
                --jq "map(select(.title == \"$title\"))[0].number // empty")
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
            else gh issue create --label catalog-update --title "$title" --body "$body"; fi
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Publish $TODAY"
            echo
            echo "Dry run: $DRY_RUN, tested: ${TESTED:-0}, protection rule: ${GUARD:-0}, changed: ${CHANGED:-0}, pushed: ${PUSHED:-0}, blocked: ${BLOCKED:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
