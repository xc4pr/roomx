name: roomx

services:
  roomx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: roomx:latest
    container_name: roomx
    env_file: .env
    environment:
      ROOMX_TOKEN: ${ROOMX_TOKEN:?Set ROOMX_TOKEN in deploy/.env}
    ports:
      - "${ROOMX_PORT:-8422}:8000"
    volumes:
      - roomx-data:/data
    restart: unless-stopped

volumes:
  roomx-data:
